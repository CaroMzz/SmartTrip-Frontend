# Análisis de SonarCloud desde GitHub Actions (.github/workflows/sonar.yml).
# El análisis automático de SonarCloud no lee coverage: hay que desactivarlo en
# Administration → Analysis Method para que este archivo tome efecto.
sonar.projectKey=FedericoKnopf_SmartTrip-Frontend
sonar.organization=wellyouveheardaboutlovingivinsighttotheblindmybabyslovincausethesuntoshine

# Código y pruebas viven en src/: las pruebas (src/__tests__ y la configuración de src/test)
# se sacan de sources y se declaran como tests, así no se indexan dos veces.
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/__tests__/**,src/test/**,**/node_modules/**,**/dist/**,coverage/**
sonar.test.inclusions=src/__tests__/**,src/test/**
sonar.sourceEncoding=UTF-8

# Reporte que genera `npm run test:coverage` (Vitest + @vitest/coverage-v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Archivos de configuración de herramientas (Vite, Vitest, ESLint): no son código de la app.
sonar.coverage.exclusions=**/*.config.js
